<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eaglepoint Daily Pulse Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="app-header">
        <div>
            <p class="eyebrow">Eaglepoint.ai PM tracker</p>
            <h1>Daily Pulse</h1>
        </div>
        <div class="header-summary">
            <span>Aquila: finished tasks</span>
            <strong>This site: today&apos;s risk</strong>
            <small id="storageStatus">Local preview mode</small>
        </div>
    </header>

    <nav class="nav" aria-label="Tracker views">
        <button class="nav-btn active" type="button" data-tab="daily">Daily Pulse</button>
        <button class="nav-btn" type="button" data-tab="blockers">Blockers</button>
        <button class="nav-btn" type="button" data-tab="summary">Weekly Summary</button>
    </nav>

    <main class="container">
        <section class="metric-grid" aria-label="Today summary">
            <article class="metric-card">
                <span>Submitted Today</span>
                <strong id="todayCount">0</strong>
            </article>
            <article class="metric-card">
                <span>Open Blockers</span>
                <strong id="blockerCount">0</strong>
            </article>
            <article class="metric-card">
                <span>Waiting / Clarifying</span>
                <strong id="watchCount">0</strong>
            </article>
            <article class="metric-card">
                <span>No Update Yet</span>
                <strong id="missingCount">0</strong>
            </article>
        </section>

        <section id="daily" class="tab-content active">
            <div class="section-heading">
                <div>
                    <p class="eyebrow">Developer input</p>
                    <h2>Today&apos;s pulse</h2>
                </div>
                <button class="secondary-btn" type="button" id="exportPulseBtn">Export CSV</button>
            </div>

            <form id="pulseForm" class="panel form-panel">
                <div class="form-row">
                    <label>
                        Name
                        <select id="developerName" required>
                            <option value="">Select developer</option>
                            <option>禹</option>
                            <option>Tad</option>
                            <option>Liul</option>
                            <option>Nati</option>
                            <option>Bisrat</option>
                            <option>Simon</option>
                            <option>Other</option>
                        </select>
                    </label>
                    <label>
                        Aquila task ID
                        <input id="taskId" type="text" placeholder="TK-2025-0456" required>
                    </label>
                </div>

                <div class="form-row">
                    <label>
                        Current status
                        <select id="pulseStatus" required>
                            <option value="on_track">On track</option>
                            <option value="needs_clarification">Need clarification</option>
                            <option value="blocked">Blocked</option>
                            <option value="waiting">Waiting for review/client/system</option>
                        </select>
                    </label>
                    <label>
                        Expected finish
                        <select id="expectedFinish" required>
                            <option value="today">Today</option>
                            <option value="tomorrow">Tomorrow</option>
                            <option value="two_plus_days">2+ days</option>
                            <option value="unknown">Unknown</option>
                        </select>
                    </label>
                </div>

                <label>
                    Short progress note
                    <textarea id="progressNote" placeholder="What is happening with the current task?"></textarea>
                </label>

                <label>
                    Help needed
                    <textarea id="helpNeeded" placeholder="Guideline, review, system access, client clarification, internet issue, etc."></textarea>
                </label>

                <div class="form-actions">
                    <button class="primary-btn" type="submit">Submit Pulse</button>
                    <p id="formStatus" role="status"></p>
                </div>
            </form>

            <div class="section-heading compact">
                <div>
                    <p class="eyebrow">PM view</p>
                    <h2>Latest by developer</h2>
                </div>
            </div>
            <div id="latestPulseList" class="card-list"></div>
        </section>

        <section id="blockers" class="tab-content">
            <div class="section-heading">
                <div>
                    <p class="eyebrow">Action queue</p>
                    <h2>Open blockers</h2>
                </div>
                <button class="secondary-btn" type="button" id="clearResolvedBtn">Clear Resolved</button>
            </div>
            <div id="blockerList" class="card-list"></div>
        </section>

        <section id="summary" class="tab-content">
            <div class="section-heading">
                <div>
                    <p class="eyebrow">Friday report</p>
                    <h2>Weekly summary</h2>
                </div>
                <button class="secondary-btn" type="button" id="copySummaryBtn">Copy Summary</button>
            </div>

            <div class="panel form-panel">
                <div class="form-row">
                    <label>
                        Aquila completed tasks
                        <input id="aquilaCompleted" type="text" inputmode="numeric" pattern="[0-9]*" value="0">
                    </label>
                    <label>
                        Weekly target
                        <input id="weeklyTarget" type="text" inputmode="numeric" pattern="[0-9]*" value="75">
                    </label>
                </div>

                <label>
                    Wins
                    <textarea id="weeklyWins" placeholder="What went well this week?"></textarea>
                </label>

                <label>
                    Risks
                    <textarea id="weeklyRisks" placeholder="What still threatens delivery?"></textarea>
                </label>

                <label>
                    Next focus
                    <textarea id="weeklyNext" placeholder="What will you focus on next week?"></textarea>
                </label>
            </div>

            <pre id="summaryOutput" class="report-preview"></pre>
        </section>
    </main>

    <script src="firebase-config.js"></script>
    <script src="app.js"></script>
</body>
</html>
